<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f3eb"><meta name="description" content="Explain changes in carbon dioxide, then predict the hydrogencarbonate indicator colour in an interactive 3D lab."><title>Chroma Lab</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css?v=3"></head>
<body><header class="header"><a class="brand" href="./"><span class="brand-icon" aria-hidden="true">◕</span><b id="brand-name">Chroma Lab</b></a><div class="header-actions"><button id="lang" class="quiet">Switch language</button><button id="sound" class="quiet" aria-pressed="false">♫ Sound off</button><button id="guide" class="circle" aria-label="Help">?</button></div></header>
<main>
<section class="workspace"><aside class="scenario-panel"><div id="scenarios"></div><div class="progress-box"><div><span data-zh="完成" data-en="Completed">Completed</span><b id="progress">0 / 5</b></div><div class="progress-track"><span id="progress-fill"></span></div></div></aside>
<div class="experiment"><div class="scene-heading"><span id="scene-title">Mealworm</span></div><div id="viewport" tabindex="0" aria-label="Drag or use arrow keys to rotate the 3D experiment"><div class="scene-grain"></div><div id="fallback" hidden></div><div class="floating-label label-top" id="label-specimen"></div></div><div class="liquid-caption" id="label-liquid"></div><div class="scene-tools"><span id="rotate-hint">↔ Rotate</span><div><button id="cutaway" class="quiet" hidden>View inside foil</button><button id="reset-view" class="quiet">↺ <span data-zh="重設視角" data-en="Reset view">Reset view</span></button></div></div></div>
<aside class="task-panel"><div id="task"></div></aside></section></main>
<dialog id="guide-dialog"><button class="close" aria-label="Close">×</button><div id="guide-content"></div></dialog><script type="module" src="app.js?v=4"></script></body></html>
